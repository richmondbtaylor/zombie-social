_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://zombie_auth:8081/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
  - name: auth-v1-options
    url: http://zombie_auth:8081/
    routes:
      - name: auth-v1-options
        strip_path: true
        paths:
          - /auth/v1/
        methods:
          - OPTIONS
    plugins:
      - name: cors
  - name: rest-v1
    url: http://zombie_rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
  - name: storage-v1
    url: http://zombie_storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
